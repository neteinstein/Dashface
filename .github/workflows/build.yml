name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generated watch face is up to date
        run: |
          pip install pillow==12.0.0
          python3 tools/generate_watchface.py
          git diff --exit-code -- watchface/src/main/res/raw/watchface.xml
      - name: Validate, test, lint and build
        run: ./gradlew --console=plain :watchface:check :dataprovider:testDebugUnitTest :dataprovider:lintDebug assembleRelease
