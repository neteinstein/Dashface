name: Release

# Every push to main (or a manual run) builds both apps, signs them with the release key and
# publishes a GitHub Release tagged v1.0.<run number> with:
#   - the two signed APKs, to install directly on a watch with adb (no Play Store needed)
#   - the two signed App Bundles (.aab), for the Play Console
#   - R8's mapping file for the companion app, to decode its crash stack traces
# If the ANDROID_PUBLISHER_CREDENTIALS secret is set, it then uploads both bundles to the Play
# Console (internal track by default). See store-listing/SUBMISSION_GUIDE.md for the setup.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Fail before spending time on the build if the signing secrets are missing.
      - name: Validate required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ] && missing+=("KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required Action secrets: ${missing[*]}. See store-listing/SUBMISSION_GUIDE.md."
            exit 1
          fi

      # build.yml checks the PR, but a squash or rebase merge lands a commit on main that was
      # never built itself, so the exact commit being released is checked again here.
      - name: Generated watch face is up to date
        run: |
          pip install pillow==12.0.0
          python3 tools/generate_watchface.py
          git diff --exit-code -- watchface/src/main/res/raw/watchface.xml

      - name: Validate, test and lint
        run: ./gradlew --console=plain :watchface:check :dataprovider:testDebugUnitTest :dataprovider:lintDebug

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # Both apps are signed with the same key: the watch face can only default to the
      # companion's complications when they share it (see Development.md).
      - name: Build signed APKs and App Bundles
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --console=plain assembleRelease :watchface:bundleRelease :dataprovider:bundleRelease

      # Copies, not moves: removing Gradle's outputs would make the Play publish step below
      # rebuild the bundles instead of uploading the exact files attached to the release.
      - name: Prepare release artifacts
        id: artifacts
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          base="Dashface_${APP_VERSION_NAME}"
          cp watchface/build/outputs/apk/release/watchface-release.apk         "$dist/${base}-watchface.apk"
          cp dataprovider/build/outputs/apk/release/dataprovider-release.apk   "$dist/${base}-data.apk"
          cp watchface/build/outputs/bundle/release/watchface-release.aab      "$dist/${base}-watchface.aab"
          cp dataprovider/build/outputs/bundle/release/dataprovider-release.aab "$dist/${base}-data.aab"
          cp dataprovider/build/outputs/mapping/release/mapping.txt            "$dist/${base}-data-mapping.txt"
          (cd "$dist" && sha256sum *.apk *.aab > SHA256SUMS.txt)
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST: ${{ steps.artifacts.outputs.dist }}
          BASE: ${{ steps.artifacts.outputs.base }}
        run: |
          {
            echo "## Install on your watch"
            echo
            echo "Dashface is two apps; install both on a Wear OS 5+ watch with debugging enabled:"
            echo
            echo '```bash'
            echo "adb install -r ${BASE}-data.apk"
            echo "adb install -r ${BASE}-watchface.apk"
            echo '```'
            echo
            echo "Then long-press your watch face and choose **Dashface**."
            echo
            echo "## Files"
            echo
            echo "- \`*.apk\`: signed apps to install directly."
            echo "- \`*.aab\`: signed App Bundles for the Play Console (upload these by hand for each app's first release)."
            echo "- \`${BASE}-data-mapping.txt\`: R8 mapping to decode the companion's stack traces (\`retrace mapping.txt trace.txt\`)."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat "$DIST/SHA256SUMS.txt"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v${APP_VERSION_NAME}" "$DIST"/*.apk "$DIST"/*.aab "$DIST"/*.txt \
            --title "Dashface v${APP_VERSION_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes

      # The secrets context isn't available in step-level `if:`, so check it here.
      - name: Check Play publisher credentials
        id: play_creds
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: echo "has_credentials=${{ env.ANDROID_PUBLISHER_CREDENTIALS != '' }}" >> "$GITHUB_OUTPUT"

      # Optional. Uploads each App Bundle to the Play Console with Gradle Play Publisher, to the
      # "internal" track unless the PLAY_TRACK repo variable says otherwise. The Play API can only
      # update an app that already has one release uploaded by hand, so each app's first .aab
      # goes in through the Play Console (download it from the GitHub Release above).
      - name: Publish watch face to Play
        id: publish_watchface
        if: ${{ !cancelled() && steps.play_creds.outputs.has_credentials == 'true' }}
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --console=plain :watchface:publishReleaseBundle

      # Runs even if the watch face upload failed, so one app's problem doesn't block the other.
      - name: Publish companion to Play
        id: publish_data
        if: ${{ !cancelled() && steps.play_creds.outputs.has_credentials == 'true' }}
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --console=plain :dataprovider:publishReleaseBundle

      - name: Play publish failure hint
        if: ${{ failure() && (steps.publish_watchface.outcome == 'failure' || steps.publish_data.outcome == 'failure') }}
        run: |
          echo "::error::Play upload failed. A 403 / PERMISSION_DENIED is almost always the Play Console side: the service account isn't invited to that app, the app has no first manual release yet, or the Google Play Android Developer API isn't enabled. See 'Troubleshooting' in store-listing/SUBMISSION_GUIDE.md."

      - name: Skip Play publish
        if: ${{ steps.play_creds.outputs.has_credentials != 'true' }}
        run: echo "::notice::ANDROID_PUBLISHER_CREDENTIALS is not set, so nothing was uploaded to Play. The GitHub Release has the signed APKs and App Bundles."
