[versions]
agp = "8.13.2"
kotlin = "2.2.21"
coroutines = "1.10.2"
coreKtx = "1.17.0"
activity = "1.11.0"
complications = "1.2.1"
healthServices = "1.1.0"
guava = "33.4.8-android"
concurrentFutures = "1.3.0"
junit = "4.13.2"
xerces = "2.12.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
wear-complications-data-source-ktx = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "complications" }
health-services-client = { module = "androidx.health:health-services-client", version.ref = "healthServices" }
concurrent-futures-ktx = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "concurrentFutures" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
xerces-xsd11 = { module = "org.exist-db.thirdparty.xerces:xercesImpl", version.ref = "xerces" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
